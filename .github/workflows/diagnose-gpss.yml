name: Diagnose GPSS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect GPSS through the deployment SSH connection
        env:
          DEPLOY_KEY: ${{ secrets.GPSS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.GPSS_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.GPSS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.GPSS_DEPLOY_USER }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/gpss_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/gpss_deploy" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/gpss_deploy" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo '== host =='
          date -u
          uptime
          df -h / /var/lib/docker 2>/dev/null || true
          free -m || true
          echo '== containers =='
          docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Image}}'
          echo '== build activity =='
          ps -eo pid,ppid,etime,pcpu,pmem,args --sort=-pcpu | grep -E 'npm|node|buildkit|buildx|dockerd|containerd|git' | grep -v grep | head -30 || true
          echo '== docker disk =='
          docker system df || true
          echo '== recent docker journal =='
          journalctl -u docker --since '60 min ago' --no-pager 2>/dev/null | tail -40 || true
          echo '== compose =='
          if [ -d /opt/banshan-gpss-deploy ]; then
            cd /opt/banshan-gpss-deploy
          else
            cd /opt/banshan-academy/deployment/unified
          fi
          docker compose ps || true
          echo '== deployed commit =='
          cat /opt/banshan-gpss-deploy/gpss/DEPLOY_COMMIT 2>/dev/null || cat /opt/gpss-src/DEPLOY_COMMIT 2>/dev/null || true
          echo '== backups =='
          ls -lt /opt/gpss/backup 2>/dev/null | head -6 || true
          echo '== app log =='
          docker logs --tail 40 gpss-app 2>&1 | sed '/初始密码/d' || true
          echo '== health =='
          docker compose exec -T gpss-app node -e "fetch('http://127.0.0.1:3011/api/health').then(r => process.stdout.write(String(r.status))).catch(e => process.stdout.write(String(e)))" || true
          echo
          REMOTE
