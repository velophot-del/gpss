name: Deploy GPSS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpss-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
      - name: Run regression tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Package committed source
        run: python3 scripts/package-gpss.py "release/gpss-${GITHUB_SHA}.tar.gz"
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.GPSS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.GPSS_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/gpss_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/gpss_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/gpss_deploy" >/dev/null
      - name: Upload and deploy GPSS only
        env:
          DEPLOY_HOST: ${{ secrets.GPSS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.GPSS_DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          target="$DEPLOY_USER@$DEPLOY_HOST"
          remote_dir="/tmp/gpss-release/$GITHUB_SHA"
          ssh -i "$HOME/.ssh/gpss_deploy" -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$target" "mkdir -p '$remote_dir'"

          # 服务器无法稳定从 Docker Hub 拉取 node:24-bookworm-slim，基础镜像由 runner 预拉取后导入。
          server_arch=$(ssh -i "$HOME/.ssh/gpss_deploy" -o StrictHostKeyChecking=yes -o ConnectTimeout=15 "$target" "uname -m" | tail -n1 | tr -d '\r')
          case "$server_arch" in
            x86_64) platform=linux/amd64 ;;
            aarch64|arm64) platform=linux/arm64 ;;
            *) echo "不支持的服务器架构：$server_arch" >&2; exit 1 ;;
          esac
          docker pull --platform "$platform" node:24-bookworm-slim
          docker save node:24-bookworm-slim | gzip -1 > "release/node-base-$GITHUB_SHA.tar.gz"
          test -s "release/node-base-$GITHUB_SHA.tar.gz"

          scp -i "$HOME/.ssh/gpss_deploy" -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 \
            "release/gpss-$GITHUB_SHA.tar.gz" "release/gpss-$GITHUB_SHA.tar.gz.sha256" \
            "release/node-base-$GITHUB_SHA.tar.gz" \
            deployment/deploy-gpss-only.sh "$target:$remote_dir/"
          ssh -i "$HOME/.ssh/gpss_deploy" -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "$target" \
            "docker load -i '$remote_dir/node-base-$GITHUB_SHA.tar.gz' && rm -f '$remote_dir/node-base-$GITHUB_SHA.tar.gz' && bash '$remote_dir/deploy-gpss-only.sh' '$remote_dir/gpss-$GITHUB_SHA.tar.gz' '$remote_dir/gpss-$GITHUB_SHA.tar.gz.sha256'"
