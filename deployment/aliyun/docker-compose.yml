version: '3.9'

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    container_name: gpss-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请先设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-gpss}
      MYSQL_USER: ${DB_USER:-gpss}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请先设置 DB_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - /opt/gpss/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - gpss-net

  app:
    build:
      context: ../..
      dockerfile: deployment/aliyun/Dockerfile
    restart: unless-stopped
    container_name: gpss-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3011
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-gpss}
      DB_PASSWORD: ${DB_PASSWORD:?请先设置 DB_PASSWORD}
      DB_NAME: ${DB_NAME:-gpss}
      USE_SOCKET: 'false'
      DB_CREATE_IF_MISSING: 'false'
      JWT_SECRET: ${JWT_SECRET:?请先设置 JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ENABLE_DEMO_LOGIN: ${ENABLE_DEMO_LOGIN:-false}
      FRONTEND_URL: ${PUBLIC_URL:?请先设置 PUBLIC_URL}
      UPLOAD_DIR: /data/uploads
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - /opt/gpss/uploads:/data/uploads
      # 私有模板目录(uploads 兄弟目录)持久化,防止容器重建后丢失已发布模板
      - /opt/gpss/uploads-private:/data/uploads-private
    ports:
      - "3011:3011"
    networks:
      - gpss-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3011/api/health').then(r=>{ if(!r.ok) process.exit(1) }).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    container_name: gpss-nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gpss-net

networks:
  gpss-net:
    driver: bridge
